services:
  - type: web
    name: solo-levelling
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        sync: false
      # set to "false" after creating your own account so strangers can't sign up
      - key: ALLOW_REGISTRATION
        value: "true"
      # optional: URL the background worker calls every 10 minutes; leave empty to disable.
      # e.g. https://<your-service>.onrender.com/api/health keeps a free instance from sleeping
      - key: PING_URL
        sync: false
