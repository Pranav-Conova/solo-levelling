services:
  - type: web
    name: solo-levelling
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        sync: false
      # set to "false" after creating your own account so strangers can't sign up
      - key: ALLOW_REGISTRATION
        value: "true"
