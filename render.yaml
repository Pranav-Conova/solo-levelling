services:
  - type: web
    name: solo-levelling
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      # No DATABASE_URL: the app uses SQLite (tracker.db in the project folder).
      # The free plan's disk is temporary, so that file is reset on every deploy/restart.
      # To keep data: add a Render disk (paid plan) and set DATABASE_URL=sqlite:////var/data/tracker.db,
      # or point DATABASE_URL at a Postgres database.
      # set to "false" after creating your own account so strangers can't sign up
      - key: ALLOW_REGISTRATION
        value: "true"
      # optional: URL the background worker calls every 10 minutes; leave empty to disable.
      # e.g. https://<your-service>.onrender.com/api/health keeps a free instance from sleeping
      - key: PING_URL
        sync: false
